id: com.valvesoftware.Steam.CompatibilityTool.Pulsar
default-branch: stable
runtime: com.valvesoftware.Steam
runtime-version: stable
sdk: org.freedesktop.Sdk//26.08
# sdk-extensions:
#  - org.freedesktop.Sdk.Extension.dotnet10
build-extension: true
modules:
  - name: pulsar
    buildsystem: simple
    sources:
      # Pulsar release archive
      - type: archive
        url: https://github.com/SpaceGT/Pulsar/releases/download/v2.4.3/pulsar-v2.4.3-linux-x64.tar.gz
        sha256: 83c703d606f381a28fe6d740088ad3e368cff438db8d7e48d56142fcd02c61cf
        dest: pulsar
        x-checker-data:
          type: json
          url: https://api.github.com/repos/SpaceGT/Pulsar/releases/releases/latest
          timestamp-query: .published_at
          version-query: .tag_name | ltrimstr("v")
          url-query: '[.assets[] | select(.name | test("pulsar-v[0-9.]+linux-x64\\.tar\\.gz"))]
            | first | .browser_download_url'
      # FIXME use the dotnet10 sdk extension? 
      - type: archive
        url: https://builds.dotnet.microsoft.com/dotnet/Sdk/10.0.401/dotnet-sdk-10.0.401-linux-x64.tar.gz
        sha256: 137268c8ad939c064ff1ee2a6fdf0899d8725377114ea012fbd1ad5fa2550418
        dest: dotnet-sdk
      # FIXME: Inlcude in the release of pulsar?
      - type: file
        path: toolmanifest.vdf
      - type: file
        path: compatibilitytool.vdf
      - type: file
        path: pulsar.sh
      # Flatpak metainfo file
      - type: file
        path: com.valvesoftware.Steam.CompatibilityTool.Pulsar.metainfo.xml
    build-commands:
      - |
        echo "Moving release contents to /app/share/steam/compatibilitytools.d/Pulsar"
        mv pulsar/* /app/share/steam/compatibilitytools.d/Pulsar/
        echo "Moving dotnet contents to /app/share/steam/compatibilitytools.d/Pulsar/dotnet-sdk"
        mkdir /app/share/steam/compatibilitytools.d/Pulsar/dotnet-sdk/
        mv dotnet-sdk/* /app/share/steam/compatibilitytools.d/Pulsar/dotnet-sdk/

        mv compatibilitytool.vdf /app/share/steam/compatibilitytools.d/Pulsar/
        mv toolmanifest.vdf /app/share/steam/compatibilitytools.d/Pulsar/
        install  -Dm777 pulsar.sh /app/share/steam/compatibilitytools.d/Pulsar/

        echo "Installing metainfo"
        install -Dm644 -t ${FLATPAK_DEST}/share/metainfo com.valvesoftware.Steam.CompatibilityTool.Pulsar.metainfo.xml
